[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clinical-agent-bench-exec"
version = "0.1.0"
description = "Week 1 execution harness for ClinicalAgentBench-Exec (mock agent, real FHIR writes)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "docker: integration test that needs the HAPI FHIR docker compose stack",
]
